name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: macOS native prerequisites
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install cmake ninja || brew upgrade cmake ninja
          echo "LIBCLANG_PATH=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV"
      - name: Windows native prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm ninja -y --no-progress
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Diagnose Windows loader failures
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target -Recurse -Filter *.dll | Select-Object FullName, Length
          Get-ChildItem src-tauri/target -Recurse -Filter nexq_lib-*.exe | ForEach-Object {
            & "C:\Program Files\LLVM\bin\llvm-readobj.exe" --coff-imports $_.FullName
          }
      - uses: actions/upload-artifact@v7.0.1
        if: failure() && runner.os == 'Windows'
        with:
          name: native-loader-${{ github.workflow }}-${{ github.run_id }}
          path: |
            src-tauri/target/**/deps/nexq_lib-*.exe
            src-tauri/target/**/*.dll
          retention-days: 3
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: visual-check-${{ matrix.os }}
          path: |
            test-results/
            artifacts/*.png
          retention-days: 7
