name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: macOS native prerequisites
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install cmake ninja || brew upgrade cmake ninja
          echo "LIBCLANG_PATH=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV"
      - name: Windows native prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm ninja -y --no-progress
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: visual-check-${{ matrix.os }}
          path: |
            test-results/
            artifacts/*.png
          retention-days: 7
